<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上图下文</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 50px;
            background-color: #ffffff;
        }

        .ilist {
            display: flex;
            justify-content: center;
            gap: 15px;
            list-style: none;
            max-width: 1000px;
            margin: 0 auto;
        }

        .ilist li {
            width: 33.33%;
            height: 200px;
            position: relative;
            overflow: hidden;
        }

        .ilist li img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .ilist li p {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 16px;
            color: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 10px 0;
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <ul class="ilist">
        <li>
            <img src="./img/1.jpeg" alt="图片1">
            <p>张珑恩的上图下文</p>
        </li>
        <li>
            <img src="./img/2.jpeg" alt="图片2">
            <p>图片2</p>
        </li>
        <li>
            <img src="./img/3.jpeg" alt="图片3">
            <p>图片3</p>
        </li>
    </ul>
</body>
</html>
