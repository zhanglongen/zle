<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>418 张珑恩</title>
</head>
<body>
    <h2>HTML表单form</h2>
    <form action="http://huanqiu.com">
        <p>
            用户名：<input type="next" name="username" placeholder="请输入用户名">
        </p>
        <p>
            密码：<input type="password" name="password" placeholder="请输入密码"> 
        </p>
        <p>
            性别：
            <input type="radio" name="sex" value="n">男
            <input type="radio" name="sex" value="f">女
            <input type="radio" name="sex" value="s">保密
        </p>
        <p>
            爱好：
            <input type="checkbox" name="hobby" value="1">篮球
            <input type="checkbox" name="hobby" value="2">足球
            <input type="checkbox" name="hobby" value="3">羽毛球
        </p>
        <p>
            籍贯：<select name="province">
                <option value="1">北京</option>
                <option value="2">上海</option>
                <option value="3">广东</option>
        </p>
        <p>
            个人简介：
            <textarea name="intro" cols="30" rows="5" placeholder="请输入个人简介"></textarea>
        </p>
        <p>
            出生日期：
            <input type="date" name="birthday">
        </p>
        <p>
            电子邮箱：
            <input type="email" name="email" placeholder="请输入邮箱">
        </p>
        <p>
            多文件上传：
            <input type="file" name="files" multiple>
        </p>
        <p>
            <input type="button" value="普通按钮">
            <input type="submit" value="提交按钮">
            <input type="reset" value="重置按钮">
        </p>
    </form>
            <botton 表单外的按钮> </botton>
    </form>
</body>
</html>
