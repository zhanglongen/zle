<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景颜色渐变动画</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #ffffff 0, #edf2f4 45%, #dce5e8 100%);
        }

        .color-box {
            width: 220px;
            aspect-ratio: 1;
            border: 1px solid rgb(255 255 255 / 45%);
            border-radius: 28px;
            animation:
                color-change 8s ease-in-out infinite,
                float-and-tilt 4s ease-in-out infinite,
                shadow-pulse 4s ease-in-out infinite;
        }

        .color-box::before {
            content: "";
            display: block;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(135deg, rgb(255 255 255 / 35%), transparent 55%);
            animation: sheen 4s ease-in-out infinite;
        }

        @keyframes color-change {
            0%, 100% { background-color: #ff6b6b; }
            25% { background-color: #ffd166; }
            50% { background-color: #06d6a0; }
            75% { background-color: #118ab2; }
        }

        @keyframes float-and-tilt {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-18px) rotate(4deg); }
        }

        @keyframes shadow-pulse {
            0%, 100% { box-shadow: 0 18px 35px rgb(30 50 60 / 18%); }
            50% { box-shadow: 0 30px 50px rgb(30 50 60 / 28%); }
        }

        @keyframes sheen {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }

        @media (prefers-reduced-motion: reduce) {
            .color-box,
            .color-box::before {
                animation-duration: 20s;
            }
        }
    </style>
</head>
<body>
    <div class="color-box" aria-label="背景颜色循环变化的盒子"></div>
</body>
</html>
