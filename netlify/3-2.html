<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>418 张珑恩</title>
    <style>
        p{
            color:blue;
            font-size: 50px;
        }
        #box{
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }
        .n1{
            color:blue;
        }
        .selector-name{
            color: #fff;
        }
        #new-box{
            width: 300px;
            height: 300px;
            background-color: #f2b84b;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p>CSS<span class="selector-name">选择器</span></p>
        <p><span class="n1">张</span><span style="color:red;">珑</span><span style="color:green;">恩</span></p>
        <p>CSS属性</p>
    </div>
    <div id="new-box"></div>
    <style>
        h2{
            background-color: #000;
            color: #fff;
        }
    </style>
</body>
</html>
