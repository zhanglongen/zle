<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f2ee">
    <title>张珑恩的影像记录</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 48px 24px;
            color: #202827;
            background:
                radial-gradient(ellipse at 12% 18%, rgb(225 231 222 / 72%), transparent 34%),
                radial-gradient(ellipse at 90% 82%, rgb(232 218 201 / 55%), transparent 32%),
                #f3f2ee;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        }

        .page {
            width: min(920px, 100%);
        }

        .page-heading {
            margin-bottom: 24px;
            animation: heading-enter 700ms ease-out both;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #b54e39;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            line-height: 1.25;
        }

        .gallery {
            position: relative;
            height: clamp(440px, 68vh, 610px);
            overflow: hidden;
            border: 1px solid rgb(32 40 39 / 9%);
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 24px 64px rgb(44 49 43 / 13%);
        }

        .slide {
            position: absolute;
            inset: 0;
            margin: 0;
            opacity: 0;
            visibility: hidden;
            animation: slide-show 15s ease-in-out infinite;
        }

        .slide:nth-child(2) {
            animation-delay: 5s;
        }

        .slide:nth-child(3) {
            animation-delay: 10s;
        }

        .slide img {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .caption {
            position: absolute;
            z-index: 1;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 24px 34px;
            color: #fff;
            background: rgb(0 0 0 / 68%);
            backdrop-filter: blur(8px);
        }

        .slide-number {
            flex: 0 0 auto;
            color: #fff;
            font-family: Georgia, serif;
            font-size: 17px;
        }

        .caption-copy {
            padding-left: 22px;
            border-left: 1px solid rgb(255 255 255 / 45%);
        }

        .caption h2 {
            margin: 0 0 7px;
            font-size: 20px;
            font-weight: 650;
        }

        .caption p {
            margin: 0;
            color: rgb(255 255 255 / 82%);
            font-size: 14px;
            line-height: 1.7;
        }

        @keyframes slide-show {
            0% {
                opacity: 0;
                visibility: visible;
                transform: translateY(10px);
            }
            5% {
                opacity: 1;
                transform: translateY(0);
            }
            28% {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }
            34%, 100% {
                opacity: 0;
                visibility: hidden;
                transform: translateY(-8px);
            }
        }

        @keyframes heading-enter {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 28px 16px;
            }

            .page-heading {
                margin-bottom: 18px;
            }

            .gallery {
                height: min(72vh, 560px);
                min-height: 420px;
            }

            .caption {
                gap: 16px;
                padding: 20px;
            }

            .caption-copy {
                padding-left: 16px;
            }

            .caption h2 {
                font-size: 18px;
            }

            .caption p {
                font-size: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .page-heading {
                animation: none;
            }

            .slide {
                animation: none;
            }

            .slide:first-child {
                opacity: 1;
                visibility: visible;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="page-heading">
            <p class="eyebrow">Visual journal</p>
            <h1>张珑恩的影像记录</h1>
        </header>

        <section class="gallery" aria-label="自动播放的影像幻灯片">
            <figure class="slide">
                <img src="netlify/img/1.jpeg" alt="民众挥舞中国和埃及国旗，欢迎访问代表团">
                <figcaption class="caption">
                    <span class="slide-number">01</span>
                    <div class="caption-copy">
                        <h2>热烈欢迎</h2>
                        <p>两国旗帜交相映衬，欢迎现场洋溢着热情。</p>
                    </div>
                </figcaption>
            </figure>

            <figure class="slide">
                <img src="img/2.jpeg" alt="警车护送车队行驶在两侧悬挂旗帜的街道上">
                <figcaption class="caption">
                    <span class="slide-number">02</span>
                    <div class="caption-copy">
                        <h2>城市车队</h2>
                        <p>车队穿过街道，人群与旗帜记录下热闹一刻。</p>
                    </div>
                </figcaption>
            </figure>

            <figure class="slide">
                <img src="img/3.jpeg" alt="精密设备组成的现代化制造生产线">
                <figcaption class="caption">
                    <span class="slide-number">03</span>
                    <div class="caption-copy">
                        <h2>制造现场</h2>
                        <p>精密设备与自动化产线，展现工业生产的细节。</p>
                    </div>
                </figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
