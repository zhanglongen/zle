<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型、框模型,box model</title>
    <style>
        body,h2,ul,p{
            margin: 0;
            padding: 0;
        }
        #a{
            width:400px;
            height:400px;
            border:1px solid #039;
            padding:50px 40px 30px 20px; /*上 右 下 左*/
            margin:40px auto;
        }
        #b{
            width:400px;
            height:400px;
            border:1px solid #039;
            margin:40px auto;
        }
        #c,#d{
            width:400px;
            height:400px;
            border:3px dotted #039;
            margin:40px auto;
        }
        /* 扩展2: 找人和网页，修改其中的3-5部分 */
    </style>
</head>
<body>
    <div id="a">418张珑恩</div>
    <div id="b">418张珑恩</div>
    <div id="c">418张珑恩</div>
    <div id="d">418张珑恩</div>
</body>
</html>
